[project]
name = "task-tracker"
version = "1.0.0"
description = "Персональный трекер задач с аналитикой"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.14,<3",
    "uvicorn>=0.30,<1",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "argon2-cffi>=23.1,<27",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=2,<3",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
