[project]
name = "databases"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pymongo>=4.18.1",
    "redis>=8.1.0",
    "sqlalchemy",
]

[dependency-groups]
test = [
    "faker>=40.43.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "postgres: integration tests requiring a separate PostgreSQL test database",
]
